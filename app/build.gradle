plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.gallofok.instasaver'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gallofok.instasaver'
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName '0.3.9'
        ndk { abiFilters 'arm64-v8a' }
    }
    // The keystore is decrypted only on trusted, manually dispatched CI runs.
    // PR builds use Gradle's ephemeral debug certificate and are not distributed.
    if (System.getenv('INSTA_SAVER_KEYSTORE_FILE')
            && System.getenv('INSTA_SAVER_KEYSTORE_PASSWORD')) {
        signingConfigs {
            permanent {
                storeFile file(System.getenv('INSTA_SAVER_KEYSTORE_FILE'))
                storePassword System.getenv('INSTA_SAVER_KEYSTORE_PASSWORD')
                keyAlias 'insta-saver-stable'
                keyPassword System.getenv('INSTA_SAVER_KEYSTORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.permanent
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version '3.11'
        pip { install 'yt-dlp' }
    }
}
