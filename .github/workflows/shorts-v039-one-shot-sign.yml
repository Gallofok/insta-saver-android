name: One-shot stable-signed blue UI v0.3.9
on:
  push:
    branches:
      - fix/shorts-403-recovery-v039-20261101
    paths:
      - .github/workflows/shorts-v039-one-shot-sign.yml
permissions:
  contents: read
concurrency:
  group: insta-saver-v039-stable-one-shot
  cancel-in-progress: false
jobs:
  signed-apk:
    if: github.repository == 'Gallofok/insta-saver-android' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore existing permanent signing identity
        shell: bash
        env:
          INSTA_SAVER_SIGNING_PASSPHRASE: ${{ secrets.INSTA_SAVER_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${INSTA_SAVER_SIGNING_PASSPHRASE:-}" ]]; then
            echo "::error::Missing permanent signing secret"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git cat-file -e "origin/main:.github/signing/insta-saver-signing.p12.enc"
          umask 077
          git show "origin/main:.github/signing/insta-saver-signing.p12.enc" > "$RUNNER_TEMP/signing.p12.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
            -in "$RUNNER_TEMP/signing.p12.enc" \
            -out "$RUNNER_TEMP/insta-saver-signing.p12" \
            -pass env:INSTA_SAVER_SIGNING_PASSPHRASE
          echo "INSTA_SAVER_KEYSTORE_FILE=$RUNNER_TEMP/insta-saver-signing.p12" >> "$GITHUB_ENV"
          derived_password="$(printf '%s' "$INSTA_SAVER_SIGNING_PASSPHRASE" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$derived_password"
          echo "INSTA_SAVER_KEYSTORE_PASSWORD=$derived_password" >> "$GITHUB_ENV"
      - name: Build stable-signed APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Assert v0.3.9 and unchanged signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature-verification.txt"
          cat "$RUNNER_TEMP/signature-verification.txt"
          grep -Fq '880c9f0e7c4e508662cf92dd993df919c4181979377e4138d3d99b15cd8d6859' "$RUNNER_TEMP/signature-verification.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "^package: name='com.gallofok.instasaver' versionCode='12' versionName='0.3.9'"
      - uses: actions/upload-artifact@v4
        with:
          name: insta-saver-v0.3.9-stable-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
